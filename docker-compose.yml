version: "3.8"

services:
  facta-clt-atualiza-base-offline:
    image: facta-clt-atualiza-base-offline:latest
    environment:
      - DB_PATH=/app/data/facta_clt.db
      # Basic Auth do painel /admin/* - obrigatorio (sem ADMIN_PASS, o
      # painel fica bloqueado por seguranca em vez de aberto). Valores
      # reais vem do arquivo .env na mesma pasta (nao versionado - ver
      # .gitignore). Crie /opt/facta-clt-atualiza-base-offline/.env na
      # VPS com ADMIN_USER e ADMIN_PASS antes do primeiro deploy.
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}
      # Proxy residencial (opcional) - idem, valores reais vem do .env.
      # Deixar FACTA_USAR_PROXY vazio/false para rodar sem proxy.
      - FACTA_USAR_PROXY=${FACTA_USAR_PROXY:-false}
      - FACTA_PROXY_HOST=${FACTA_PROXY_HOST:-res.proxy-seller.com}
      - FACTA_PROXY_PORT=${FACTA_PROXY_PORT:-10000}
      - FACTA_PROXY_USER=${FACTA_PROXY_USER:-}
      - FACTA_PROXY_PASS=${FACTA_PROXY_PASS:-}
    volumes:
      - facta_clt_data:/app/data
    networks:
      - traefik_public
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.facta-clt-atualiza-base-offline.entrypoints=websecure"
        - "traefik.http.routers.facta-clt-atualiza-base-offline.rule=Host(`factaclt.automacaofintech.digital`)"
        - "traefik.http.routers.facta-clt-atualiza-base-offline.tls.certresolver=letsencrypt"
        - "traefik.http.services.facta-clt-atualiza-base-offline.loadbalancer.server.port=80"

networks:
  traefik_public:
    external: true

volumes:
  facta_clt_data:
