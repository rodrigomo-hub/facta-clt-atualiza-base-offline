version: "3.8"

services:
  facta-clt-atualiza-base-offline:
    image: facta-clt-atualiza-base-offline:latest
    environment:
      - DB_PATH=/app/data/facta_clt.db
    volumes:
      - facta_clt_data:/app/data
    networks:
      - traefik_public
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.facta-clt-atualiza-base-offline.entrypoints=websecure"
        - "traefik.http.routers.facta-clt-atualiza-base-offline.rule=Host(`factaclt.automacaofintech.digital`)"
        - "traefik.http.routers.facta-clt-atualiza-base-offline.tls.certresolver=letsencrypt"
        - "traefik.http.services.facta-clt-atualiza-base-offline.loadbalancer.server.port=80"

networks:
  traefik_public:
    external: true

volumes:
  facta_clt_data:
